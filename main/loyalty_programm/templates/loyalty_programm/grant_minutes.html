{% extends "loyalty_programm/base.html" %}
{% block title %}Назначить минуты{% endblock %}
{% block content %}
<h1>Назначить минуты</h1>

<div class="card">
  <p><b>{{ client.name }}</b> · {{ client.phone }} · остаток минут: <b>{{ client.minutes }}</b></p>
</div>

<div class="card">
  <form method="post">{% csrf_token %}
    <div class="form-row">
      <label>Сколько минут назначить</label>
      <input type="number" name="minutes" min="1" required autofocus>
    </div>
    <div class="form-row">
      <label>Комментарий</label>
      <input type="text" name="comment" maxlength="255"
             placeholder="покупка абонемента / подарок">
    </div>
    <button class="btn green" type="submit">Назначить</button>
    <a class="btn grey" href="{% url 'client' client.pk %}">Отмена</a>
  </form>
</div>
{% endblock %}
